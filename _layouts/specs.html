---
layout: default
---
<h1>{{ page.title }}
    {% if page.deprecated == true %}
    <span class="text-purple border border-purple mx-2 px-1">Deprecated</span>
    {% else %}
    {% if page.fix == true %}
    <span class="text-green border border-green mx-2 px-1">Fix</span>
    {% else %}
    <span class="text-red border border-red mx-2 px-1">Temp</span>
    {% endif %}
    {% endif %}</h1>
{{ content }}
